# Operational config — tunable without code changes.
# The [fast] section overlays test-mode values (selected by RUN_MODE=fast in .env
# or the fast flag in runconfig.load_config).

[linkedin]
# Randomized per-profile delay (seconds) before each LinkedIn profile harvest,
# picked uniformly in [min, max]. Human-mimicking pacing.
delay_min = 45
delay_max = 180
# Longer pause every N profiles, N picked in [every_min, every_max].
long_pause_every_min = 15
long_pause_every_max = 20
# Long pause duration (seconds), picked in [min, max]. 15-40 min.
long_pause_min = 900
long_pause_max = 2400
# Hard caps (global, persisted across runs/batches/sessions in the DB).
daily_cap = 50
weekly_cap = 250
# Seconds between per-post fetches on one profile (SGAI ~10 req/min per key).
post_interval = 7.0
# Post caps: most-recent authored posts kept (plus an always-kept bio post),
# and most-recent liked posts kept.
authored_keep = 10
liked_keep = 5
# Cap of activity items fetched per profile (0 = no cap beyond the feed slice).
max_posts = 12

[website]
# Free-first fetching (requests + BeautifulSoup). Firecrawl is only used as a
# fallback for JS-heavy/app-shell pages the free fetch cannot read.
page_timeout = 15          # seconds per page (free fetch)
per_domain_delay = 1.0     # seconds between hits to the same domain
free_first = true          # false = always use Firecrawl (old behavior)

[budget]
# Hard LLM spend cap per analysis session, in USD. When the running total of
# logged LLM calls for a session reaches this cap, scoring stops (leads are
# marked SCORE_FAILED with reason budget_exceeded). 0 disables the cap.
session_cap_usd = 5.0

[surface_scan]
# Public Surface Scanner (deterministic GET/HEAD-only checks on the lead
# website's public surface). Findings are stored for INTERNAL review only and
# must never reach an outbound email before the outreach wording has legal
# sign-off — that outreach usage is still gated on the approval.
enabled = true
timeout = 10             # seconds per single request
per_domain_delay = 1.0   # seconds between hits to the same domain (shared throttle)
max_findings = 8         # cap on rows written per lead

[triggers]
# Trigger monitoring (solve WHEN): weekly re-checks of scored leads. When a
# readiness signal changes (first engineer hired, pricing page appears, moved
# off a builder subdomain, team growth...), the lead jumps to the top of the
# review queue with the trigger as the hook. Run by `python tools/run_triggers.py`
# from cron / a scheduled cloud job.
enabled = false
# Re-check interval (days) applied as leads.next_check_at (+ interval).
interval_days = 7
# Safety net: max leads checked in one scheduled run.
max_leads_per_run = 50
# Only leads at/above this confidence, in a target segment and NOT flagged for
# human review get the expensive LinkedIn check (founder_posts_pain).
high_value_confidence = 0.8
# team_growth fires when the Apollo headcount rises at least this many people
# since the last snapshot.
team_growth_delta = 3
# When false: triggers still fire, still log to lead_trigger_events, still set
# trigger_hook — only the review queue ORDER BY (priority DESC) is skipped.
reorder_queue = true
# Monthly SGAI budget for the PAID trigger search lane (funding_announced /
# product_hunt: one governed web search per lead per run = 1 nominal credit).
# SEPARATE from [apollo].monthly_credit_cap on purpose: one vendor's budget
# must never throttle the other. PLACEHOLDER pending a real ScrapeGraphAI
# quota number — re-size before going live. 0 = off.
# TODO(pre-launch): replace with the real SGAI quota; 1000 is a placeholder.
sgai_monthly_credit_cap = 1000

[fast]
# Test-mode overlay: shrinks LinkedIn delays and bypasses caps so the pipeline
# can be verified in minutes without waiting hours or spending the real budget.
delay_min = 2
delay_max = 4
long_pause_every_min = 1000
long_pause_every_max = 1000
long_pause_min = 3
long_pause_max = 5
bypass_caps = true

[apollo]
# Monthly Apollo enrichment credit cap. Enrichment (people bulk_match) costs
# 1 credit per person; people SEARCH is free. The credit governor blocks any
# enrichment that would push the running monthly total past this cap. 0 = off.
monthly_credit_cap = 3600
# Max people fetched per search page (Apollo max is 100).
search_page_size = 100
# Hard ceiling on people pulled in one recipe run (safety net).
max_people_per_run = 500

[prefilter]
# Stage-0 runs on free Apollo search fields BEFORE any enrichment or website
# fetch. deterministic-only by default; set use_llm = true to send the
# leftover "unclear" leads to a cheap Groq pass. min_headcount/max_headcount
# bound the target persona (0 = no bound).
enabled = true
use_llm = false
max_headcount = 50
min_headcount = 0

[sending]
# Outbound-email capacity model for the send-capacity planner (/capacity).
# NOTE: the live Gmail sender is still single-account today; this models the
# (future) multi-mailbox fleet that drives the forecast. Each mailbox has a
# daily send cap and an optional warmup ramp: ramp_start (ISO date) + ramp_days
# + ramp_start_cap, rising linearly to daily_cap.
#   A mailbox with no ramp_* keys is steady-state at full daily_cap.
[[sending.mailboxes]]
name = "primary"
daily_cap = 30

# Example of a second, ramping mailbox (uncomment to model it):
# [[sending.mailboxes]]
# name = "ramp-2"
# daily_cap = 30
# ramp_start = "2026-09-01"
# ramp_days = 10
# ramp_start_cap = 0

# Touch offsets (days from a contact's add date) at which each follow-up goes
# out. len() is the touch count — every new contact books this many send slots,
# so sustainable new-contact rate ~= total daily capacity / touch count.
sequence_offsets = [0, 3, 7]

[costs]
# Phase 4 — cost-per-outcome model (Task 17): what a positive reply / closed
# deal actually costs across recipe/segment/channel. These are ESTIMATES that
# feed $/reply and $/close on the Analytics → Cost screens; set them to your
# real invoice numbers.
# Apollo enrichment credit price (people bulk_match = 1 credit per person).
apollo_credit_price_usd = 0.05
# Per-website scrape estimate (Firecrawl credit or free-first fetch time).
scrape_price_usd = 0.01
# Operator time: hourly rate and minutes spent reviewing ONE lead (A/X/E queue
# plus reading the verdict). time_cost = reviewed leads * minutes/60 * rate.
operator_rate_usd_hour = 30.0
review_minutes_per_lead = 5
