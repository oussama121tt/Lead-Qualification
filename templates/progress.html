<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Analyse en cours — Lead Qualification Engine</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <style>
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 0; margin-bottom: 20px; gap: 12px;
    }
    .topbar h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.5rem; margin: 0; letter-spacing: -0.02em; white-space: nowrap;
    }
    .topbar nav { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .topbar nav a { text-decoration: none; font-weight: 600; padding: 8px 16px; border-radius: 10px; font-size: 0.9rem; transition: background 0.12s, color 0.12s; }
    .topbar nav a:hover { background: var(--bg-soft); }
    .topbar nav a.primary { background: var(--accent); color: #fff; }
    .topbar nav a.primary:hover { background: var(--accent-2); }
    .topbar nav a:not(.primary) { color: var(--text); }

    .progress-card {
      max-width: 560px; margin: 40px auto;
      border: 1px solid var(--border); border-radius: 22px;
      background: var(--surface); padding: 32px 28px; text-align: center;
    }
    .progress-label {
      font-size: 1.1rem; font-weight: 600; margin-bottom: 20px;
    }
    .progress-bar-track {
      width: 100%; height: 8px;
      background: var(--bg-soft); border-radius: 99px; overflow: hidden;
      margin-bottom: 16px;
    }
    .progress-bar-fill {
      height: 100%; background: var(--accent); border-radius: 99px;
      transition: width 0.4s ease; min-width: 4px;
    }
    .progress-meta {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
      margin: 20px 0;
    }
    .progress-meta-item {
      padding: 12px; border-radius: 12px; background: var(--bg-soft);
      text-align: left;
    }
    .progress-meta-item .pm-label {
      font-size: 0.72rem; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--muted); margin-bottom: 2px;
    }
    .progress-meta-item .pm-value {
      font-size: 0.95rem; font-weight: 600;
    }
    .progress-message {
      color: var(--muted); font-size: 0.88rem; margin: 0 0 20px;
    }
    .progress-complete { animation: fade-in 0.6s ease; }
    .progress-complete.hidden { display: none; }
    .complete-icon { font-size: 2.8rem; margin-bottom: 12px; }
    .progress-complete h2 { font-family: Georgia, "Times New Roman", serif; margin-bottom: 6px; font-size: 1.3rem; }
    .progress-complete p { color: var(--muted); margin-bottom: 24px; font-size: 0.92rem; }
    .hidden { display: none !important; }
    @keyframes fade-in {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="shell">

    <div class="topbar">
      <h1>Lead Qualification &amp; Scoring</h1>
      <nav>
        <a class="primary" href="{{ url_for('home') }}#dropzone">Nouvelle analyse</a>
        <a href="{{ url_for('history') }}">Historique</a>

      </nav>
    </div>

    <div class="progress-card">
      <div class="progress-label" id="progressLabel">Analyse en cours...</div>

      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progressBarFill" style="width: 0%;"></div>
      </div>

      <div class="progress-meta">
        <div class="progress-meta-item">
          <div class="pm-label">Progression</div>
          <div class="pm-value" id="leadIndex">&mdash; / &mdash;</div>
        </div>
        <div class="progress-meta-item">
          <div class="pm-label">Temps</div>
          <div class="pm-value" id="elapsedTime">0:00</div>
        </div>
        <div class="progress-meta-item" style="grid-column:1/-1;">
          <div class="pm-label">Étape</div>
          <div class="pm-value" id="currentStep">Initialisation</div>
        </div>
      </div>

      <p class="progress-message" id="progressMessage">
        Le pipeline d'analyse est en cours d'exécution. Les résultats s'afficheront automatiquement.
      </p>

      <div class="progress-complete hidden" id="progressComplete">
        <div class="complete-icon" id="completeIcon">&#x2705;</div>
        <h2 id="completeTitle">Analyse terminée !</h2>
        <p id="completeDetails">Tous les leads ont été traités.</p>
        <div id="completedActions" class="d-flex gap-3 justify-content-center flex-wrap">
          <a class="btn btn-primary btn-lg" href="{{ url_for('results_view', session_id=session_id) }}" id="viewResultsBtn">
            Voir les résultats
          </a>
        </div>
      </div>
    </div>

  </div>

<script>
(function() {
  const sessionId = {{ session_id }};
  const PROGRESS_URL = "{{ url_for('progress_stream', session_id=session_id) }}";
  const RESULTS_URL = "{{ url_for('results_view', session_id=session_id) }}";

  const elements = {
    label: document.getElementById('progressLabel'),
    barFill: document.getElementById('progressBarFill'),
    leadIndex: document.getElementById('leadIndex'),
    currentStep: document.getElementById('currentStep'),
    elapsedTime: document.getElementById('elapsedTime'),
    message: document.getElementById('progressMessage'),
    complete: document.getElementById('progressComplete'),
    completeIcon: document.getElementById('completeIcon'),
    completeTitle: document.getElementById('completeTitle'),
    completeDetails: document.getElementById('completeDetails'),
    viewBtn: document.getElementById('viewResultsBtn'),
  };

  let startTime = Date.now();
  let timerInterval = null;
  let completed = false;

  function formatElapsed(seconds) {
    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60);
    return m + ':' + s.toString().padStart(2, '0');
  }

  function updateTimer() {
    if (completed) return;
    const elapsed = (Date.now() - startTime) / 1000;
    elements.elapsedTime.textContent = formatElapsed(elapsed);
  }

  function translateStep(step) {
    const map = {
      'scraping': 'Scraping du site web...',
      'scraping_done': 'Site web analysé',
      'scoring': 'Scoring IA en cours...',
      'done': 'Terminé',
      'waiting': 'En attente...',
    };
    return map[step] || step || '--';
  }

  function translateStatus(status) {
    const map = {
      'FETCH_FAILED': 'Échec du scraping',
      'FETCH_PARTIAL': 'Scraping partiel',
      'PARSED': 'Contenu parsé',
      'SCORE_FAILED': 'Échec du scoring',
      'LOW_CONFIDENCE': 'Confiance faible',
      'SCORED': 'Scoré',
    };
    return map[status] || status || '--';
  }

  function handleProgress(data) {
    if (data.status === 'waiting') {
      const total = data.total || 0;
      if (total > 0) {
        elements.leadIndex.textContent = '0 / ' + total;
        elements.label.textContent = 'Lead 1 sur ' + total + ' — préparation...';
        elements.currentStep.textContent = total + ' lead(s) trouvé(s)';
      } else {
        elements.currentStep.textContent = 'Démarrage du pipeline...';
      }
      return;
    }

    const index = data.index || 0;
    const total = data.total || 1;
    const pct = Math.round((index / total) * 100);

    elements.barFill.style.width = Math.min(pct, 100) + '%';
    elements.leadIndex.textContent = index + ' / ' + total;

    const company = data.company_name || '';
    if (company) {
      elements.label.textContent = 'Lead ' + index + ' sur ' + total + ' — ' + company;
    } else {
      elements.label.textContent = 'Lead ' + index + ' sur ' + total;
    }

    const step = data.step || '';
    const status = data.status || '';
    if (step === 'scraping') {
      elements.currentStep.textContent = 'Scraping : ' + (data.company_name || '--');
    } else if (step === 'scraping_done') {
      elements.currentStep.textContent = translateStatus(status);
    } else if (step === 'scoring') {
      elements.currentStep.textContent = 'Scoring IA : ' + (data.company_name || '--');
    } else if (step === 'done') {
      elements.currentStep.textContent = (data.company_name || '--') + ' scoré';
    } else {
      elements.currentStep.textContent = translateStep(step);
    }

    if (data.error) {
      elements.message.textContent = (data.company_name || '') + ': ' + data.error;
      elements.message.style.color = 'var(--warning)';
    }
  }

  function showCompletion(data) {
    completed = true;
    if (timerInterval) clearInterval(timerInterval);

    const isFailed = data.status === 'failed';
    const success = data.status === 'completed';

    elements.barFill.style.width = '100%';
    elements.barFill.style.background = success
      ? 'var(--accent)'
      : 'var(--danger)';

    const processed = data.processed || 0;
    const total = data.total || processed;
    elements.leadIndex.textContent = processed + ' / ' + total;
    elements.currentStep.textContent = success ? 'Terminé' : 'Échoué';
    elements.label.textContent = success ? 'Analyse terminée' : 'Analyse échouée';

    if (data.completed_ts && data.started_at) {
      const dur = data.completed_ts - data.started_at;
      elements.elapsedTime.textContent = formatElapsed(dur);
    }

    if (success) {
      elements.completeIcon.textContent = '\u2705';
      elements.completeTitle.textContent = 'Analyse terminée !';
      elements.completeDetails.textContent = processed + ' lead(s) traité(s) en ' + elements.elapsedTime.textContent + '.';
      document.getElementById('completedActions').classList.remove('hidden');
    } else {
      elements.completeIcon.textContent = '\u274C';
      elements.completeTitle.textContent = 'Analyse échouée';
      elements.completeDetails.textContent = data.error
        ? 'Erreur : ' + data.error
        : processed + ' lead(s) traités avant l\'échec.';
      document.getElementById('completedActions').classList.remove('hidden');
    }

    elements.message.classList.add('hidden');
    elements.complete.classList.remove('hidden');

    setTimeout(function() {
      window.location.href = RESULTS_URL;
    }, 5000);
  }

  function connectSSE() {
    const source = new EventSource(PROGRESS_URL);

    source.onmessage = function(event) {
      try {
        const data = JSON.parse(event.data);

        if (data.status === 'waiting') {
          handleProgress(data);
          return;
        }

        if (data.status === 'completed' || data.status === 'failed') {
          showCompletion(data);
          source.close();
          return;
        }

        handleProgress(data);
      } catch (e) {
        console.error('SSE parse error:', e, event.data);
      }
    };

    source.onerror = function() {
      source.close();
      setTimeout(connectSSE, 3000);
    };
  }

  timerInterval = setInterval(updateTimer, 1000);
  connectSSE();
})();
</script>
</body>
</html>
