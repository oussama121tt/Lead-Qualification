<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Lead Qualification Engine</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <style>
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 0; margin-bottom: 20px; gap: 12px;
      border-bottom: 1px solid var(--border);
    }
    .topbar h1 {
      font-family: 'Inter', -apple-system, sans-serif;
      font-weight: 700;
      font-size: 1.85rem; margin: 0; letter-spacing: -0.02em; white-space: nowrap;
    }
    .topbar nav { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .topbar nav a { text-decoration: none; font-weight: 600; padding: 8px 16px; border-radius: var(--radius-pill); font-size: 0.9rem; transition: background 0.12s, color 0.12s; }
    .topbar nav a:hover { background: var(--surface-2); }
    .topbar nav a.primary { background: var(--gradient); color: #fff; }
    .topbar nav a.primary:hover { background: var(--gradient); opacity: 0.9; }
    .topbar nav a:not(.primary) { color: var(--text-primary); }

    .auth-card {
      max-width: 420px; margin: 48px auto;
      border: 1px solid var(--border); border-radius: var(--radius-lg);
      background: var(--surface-1); padding: 32px;
      box-shadow: var(--shadow-md);
    }
    .auth-card h2 { margin: 0 0 4px; font-family: 'Inter', -apple-system, sans-serif; font-weight: 700; font-size: 1.3rem; }
    .auth-card .lead { margin: 0 0 24px; color: var(--text-secondary); font-size: 0.92rem; }
    .auth-alt { margin-top: 20px; text-align: center; font-size: 0.9rem; color: var(--text-secondary); }
    .auth-alt a { color: var(--cyan); text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="shell">

    <div class="topbar">
      <h1>Lead Qualification &amp; Scoring</h1>
      <nav>
        <a href="{{ url_for('signup') }}">Create an account</a>
      </nav>
    </div>

    <div class="auth-card">
      <h2>Sign in</h2>
      <p class="lead">Access your analyses and history.</p>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div class="flash-stack">
            {% for category, message in messages %}
              <div class="alert alert-{{ 'danger' if category == 'error' else category }} shadow-sm">{{ message }}</div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      <form method="post" action="{{ url_for('login') }}">
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" name="email" class="form-control" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <div class="input-group">
            <input type="password" name="password" id="password" class="form-control" required>
            <button class="btn btn-outline-secondary" type="button" id="togglePassword" aria-label="Show password" style="border-top-left-radius:0;border-bottom-left-radius:0;">
              <svg id="eyeOpen" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg id="eyeOff" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-10-8-10-8a13.45 13.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 10 8 10 8a13.45 13.45 0 0 1-1.67 2.39"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>
            </button>
          </div>
        </div>
        <button class="btn btn-primary w-100" type="submit">Sign in</button>
      </form>
      <p class="auth-alt">No account? <a href="{{ url_for('signup') }}">Create one</a></p>
    </div>

  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById('togglePassword').addEventListener('click', function() {
      var input = document.getElementById('password');
      var show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      document.getElementById('eyeOpen').style.display = show ? 'none' : '';
      document.getElementById('eyeOff').style.display = show ? '' : 'none';
    });
  </script>
</body>
</html>
