<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Lead Qualification Engine</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <style>
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 0; margin-bottom: 20px; gap: 12px;
    }
    .topbar h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.85rem; margin: 0; letter-spacing: -0.02em; white-space: nowrap;
    }
    .topbar nav { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .topbar nav a { text-decoration: none; font-weight: 600; padding: 8px 16px; border-radius: 10px; font-size: 0.9rem; transition: background 0.12s, color 0.12s; }
    .topbar nav a:hover { background: var(--bg-soft); }
    .topbar nav a.primary { background: var(--accent); color: #fff; }
    .topbar nav a.primary:hover { background: var(--accent-2); }
    .topbar nav a:not(.primary) { color: var(--text); }

    .auth-card {
      max-width: 420px; margin: 48px auto;
      border: 1px solid var(--border); border-radius: 22px;
      background: var(--surface); padding: 32px;
    }
    .auth-card h2 { margin: 0 0 4px; font-family: Georgia, "Times New Roman", serif; font-size: 1.3rem; }
    .auth-card .lead { margin: 0 0 24px; color: var(--muted); font-size: 0.92rem; }
    .auth-alt { margin-top: 20px; text-align: center; font-size: 0.9rem; color: var(--muted); }
    .auth-alt a { color: var(--accent); text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="shell">

    <div class="topbar">
      <h1>Lead Qualification &amp; Scoring</h1>
      <nav>
        <a href="{{ url_for('signup') }}">Create an account</a>
      </nav>
    </div>

    <div class="auth-card">
      <h2>Sign in</h2>
      <p class="lead">Access your analyses and history.</p>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div class="flash-stack">
            {% for category, message in messages %}
              <div class="alert alert-{{ 'danger' if category == 'error' else category }} shadow-sm">{{ message }}</div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      <form method="post" action="{{ url_for('login') }}">
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" name="email" class="form-control" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <button class="btn btn-primary w-100" type="submit">Sign in</button>
      </form>
      <p class="auth-alt">No account? <a href="{{ url_for('signup') }}">Create one</a></p>
    </div>

  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
