# RuyaTech lead-generation profile.
#
# STRUCTURE (all keys are snake_case):
#   [identity]         who sends the mail: company, sender, one-liner, proof points.
#   [offers.<key>]     one table per offer. <key> is the offer id used in verdicts
#                      (recommended_offer) and in [sequences.offers.<key>].
#   [segments.<key>]   one table per segment. <key> is the segment id used in
#                      verdicts. `offer` points at an [offers] key (or "none").
#                      `is_target` drives TARGET vs review/out-of-target routing.
#   [icp]              who we look for: headcount, countries, founded years,
#                      titles, and the Stage-0 reject/keep marker lists.
#                      Marker lists are plain strings joined into one regex at
#                      load time (see profile.py) — no regex syntax needed to
#                      edit them, except dev_shop_pattern which stays a pattern.
#   [voice]            real lines that earned replies; generators imitate these.
#   [sequences]        Apollo sequence wiring for this offer set.
#   [[derivation.rules]] founder_profile x build_evidence -> segment/offer rules
#                      applied when the model returns segment "unclear".
#   [scoring_criteria] labels for the review-queue criteria picker.
#
# RULE: to change what we sell or to whom, edit this file only. No .py file
# holds business text for this profile.

[identity]
company = "RuyaTech"
sender_name = "Oussama Ibrahim"
sender_title = "Founder"
one_liner = "a technical agency that builds, rescues and scales SaaS products"
proof_points = [
  "fixed price announced before coding (no hourly billing)",
  "10+ delivered projects",
  "100% of the code belongs to the client from day one",
  "reply within 4 business hours",
]

[offers.ai_audit]
name = "Product Rescue & Scale-Up"
who = "non-technical founder whose product was built with AI (vibe-coding — Cursor, Replit, ChatGPT, Lovable, Bolt) and starts breaking under real users"
detail = "full code audit, stabilization, refactoring, and getting it back on track — typically in 4 to 8 weeks"
case_study = "we took over an AI-generated SaaS that was collapsing, relaunched it in 2 weeks, 600 paying members 6 months later (Bake Genie case study)"

[offers.general_audit]
name = "Product Rescue & Scale-Up"
who = "a technical team"
detail = "security and architecture audit, concrete recommendations, fix prioritization"
case_study = ""

[offers.pipeline]
name = "AI Agents & Automation"
who = "a scaling agency"
detail = "custom AI agents and automations plugged into existing systems (lead triage, document processing, workflows), not \"AI gadgets\""
case_study = "lead triage pipeline delivered to an overwhelmed B2B firm — 5h/week of business dev instead of several hours a day, 30K$+ in new contracts in 30 days"

[segments.ai_solo_founder]
description = "AI-built product owned by a non-technical founder"
offer = "ai_audit"
is_target = true
label = "Solo AI founder"
criteria_label = "TARGET: Non-tech vibe coder"
criteria_desc = "Non-technical founder building with AI (Cursor, Bolt, Lovable, Replit, vibe coding)."

[segments.technical_founder]
description = "technical team needing architecture or security review"
offer = "general_audit"
is_target = true
label = "Technical founder"
criteria_label = "TARGET: Tech person using AI"
criteria_desc = "Technical team using AI as a development tool."

[segments.small_agency_scaling]
description = "agency or studio that is scaling"
offer = "pipeline"
is_target = true
label = "Small scaling agency"
criteria_label = "TARGET: Scaling agency"
criteria_desc = "Agency / services studio that is scaling."

[segments.too_big]
description = "company too large for the offer"
offer = "none"
is_target = false
label = "Too big"
criteria_label = "Not target: too big"
criteria_desc = "Established company too large for the offer."

[segments.wrong_field]
description = "lead clearly outside the target field"
offer = "none"
is_target = false
label = "Wrong field"
criteria_label = "Not target: wrong field"
criteria_desc = "Lead clearly outside the target field."

[segments.unclear]
description = "insufficient evidence to segment"
offer = "none"
is_target = false
label = "Unclear"
criteria_label = "Unclear"
criteria_desc = "Insufficient evidence to segment."

[icp]
max_headcount = 20
min_headcount = 0
countries = ["United States", "United Kingdom", "Canada", "Australia", "Ireland", "New Zealand"]
founded_year_min = 2020
founded_year_max = 2026
person_titles = ["founder", "co-founder", "ceo", "owner"]
employee_ranges = ["1,10", "11,20"]

# NOTE: 'studio' is deliberately NOT in reject_company_markers — a product
# studio is a target (golden case george = small_agency_scaling). Only
# unambiguous service providers are rejected; ambiguous names fall through
# to 'unclear'/'keep'.
reject_company_markers = [
  'agency',
  'agencies',
  'consult(?:ing|ancy|ants?)?',
  'labs?',
  'solutions',
  'software\\s+house',
  'digital\\s+agency',
  'dev\\s?shop',
  'web\\s+design',
  'it\\s+services',
  'systems?\\b',
  'systems\\s+integrat',
  'outsourc',
  'technolog(?:y|ies)\\s+partner',
  'interactive',
  'creative\\s+agency',
  'staffing',
  'recruit(?:ing|ment)\\s+agency',
  'we\\s+build',
  'development\\s+(?:company|partner|services)',
  'mvp\\s+(?:development|studio|agency)',
  'app\\s+development',
  'software\\s+development',
]

# "X Software" / "X Technologies" with no product word is the classic
# dev-shop naming pattern. Product companies say what they DO.
dev_shop_pattern = "^[\\w&.'\\- ]{1,40}\\s+(software|technologies|technology|tech|systems|digital|it)\\s*(inc|llc|ltd|limited|pvt|pty|gmbh|co)?\\.?$"

# NOTE: plain "CTO", "engineer" or "technical co-founder" titles are
# deliberately NOT rejected here: a CTO / engineering founder of their OWN
# product company IS the technical_founder segment (golden cases marius,
# eric). Only the fractional / consulting / "we build for you" variants
# below are competitors — do not "fix" this by adding bare CTO/engineer.
reject_title_markers = [
  'agency\\s+owner',
  'freelance',
  'freelancer',
  'consultant',
  'contractor',
  'fractional\\s+(?:cto|cpo|coo|cmo|cfo)',
  'advisor',
  'mentor',
  'coach',
  'managing\\s+director\\s+at\\s+.*\\bagency\\b',
  'we\\s+build\\s+(?:your|apps|mvps|software|products)',
]

non_decision_title_markers = [
  'intern',
  'student',
  'assistant',
  'recruiter',
  'talent',
  'hr\\b',
  'human\\s+resources',
  'sales\\s+(?:rep|representative|development)',
  'sdr\\b',
  'bdr\\b',
  'account\\s+executive',
  'support',
  'customer\\s+success',
  'bookkeeper',
  'accountant',
  'receptionist',
]

founder_title_markers = [
  'founder',
  'co-?founder',
  'ceo',
  'owner',
  'managing\\s+partner',
  'president',
  'chief\\s+executive',
]

llm_prefilter_system = "You are a fast pre-filter for a B2B lead list. Given only a person's title, company name, headcount and founded year (no website), decide if they are plausibly a NON-TECHNICAL or technical FOUNDER of a small software product company (our target), or clearly NOT (agency, consultancy, dev shop, fractional CTO, enterprise employee, recruiter, unrelated sector). Respond ONLY as JSON: {\"decision\": \"keep\"|\"reject\", \"reason\": \"...\"}. When genuinely unsure, keep — a wrong reject loses a good lead."

[voice]
# Real lines from the AIAUDIT campaigns (Apollo, Aug-Sep 2026). These are the
# style contract; do not replace them with invented examples.
examples = [
  "Swipe-native shopping means checkout has to be instant and correct every time, and you're building that on your own.",
  "Maggie helps mums find activities near them, which means the app knows where children will be and when. That's a heavier data load than most free apps carry.",
  "A year on the App Store means a year of medication records and dependants' details accumulating, shared across people who aren't in the same household.",
  "HoopDee calculates when milk expires. Most apps fail by annoying someone; yours fails by feeding a baby something it shouldn't.",
  "Weave coordinates care for people already in hardship, which makes it about the last place anyone would want a data problem.",
  "Aviva reads families' school emails to build their calendars. Inbox access is about the heaviest permission an app can hold, and you're holding it for parents.",
  "Ove is built for girls going through puberty, so the data belongs to minors and UK rules treat that more strictly than almost anything else.",
  "Doozi's whole promise is that every pin is verified and nothing is paid placement. Trust claims like that live or die on what the software actually enforces.",
  "You've just joined Honeymoon as an Earned Media Director while running Tblscape's subscriptions and payments. That's a lot of plates.",
  "SYNC pulls wearable data alongside cycle tracking, so it's holding a continuous stream of something quite personal rather than an occasional log.",
  "You're running a full real-estate practice and building Paced at the same time, which usually means the app gets your evenings and the plumbing underneath gets whatever's left.",
]

# Real subjects from the campaign that earned replies (no sequence, Mar-May 2026).
subject_examples = [
  "between nothing and something",
  "full circle from winner to judge",
  "$420 and rising",
  "about building Wella",
  "VP at Parexel to Navidence founder",
  "analyzing 1.1B views across Fashion Week",
]

# Real questions that were answered by the founder.
question_examples = [
  "is the multimodal video analysis processing live across all three platforms or still scaling up?",
  "is the behavior tracking model in testing yet or still in development?",
]

[sequences]
enabled = false
send_from_email = "oussama@ruyatech.io"
personal_line_field_id = "6a47de3d386294002003b1a6"
personalised_share = 0.5

[sequences.offers.ai_audit]
id = "6a66cad9e37fae0018459329"
sensitive_id = "6a66cac7e37fae001436c196"

[sequences.offers.general_audit]
id = "6a66caecff375500136a7483"
sensitive_id = ""

[sequences.offers.pipeline]
id = ""
sensitive_id = ""

# Derivation rules: applied in order when the model returns segment
# "unclear". Each rule names the founder_profile / build_evidence it fires
# on ("any" matches everything). confidence is "keep" (model number stands)
# or "clamp_0_5_0_7" (founder settled, build open: honest band + review).
[[derivation.rules]]
when_founder = "technical"
when_build = "any"
set_segment = "technical_founder"
set_offer = "general_audit"
confidence = "clamp_0_5_0_7"
needs_review = true

[[derivation.rules]]
when_founder = "any"
when_build = "ai_built"
set_segment = "ai_solo_founder"
set_offer = "ai_audit"
confidence = "keep"
needs_review = true

[[derivation.rules]]
when_founder = "non_technical"
when_build = "any"
set_segment = "ai_solo_founder"
set_offer = "ai_audit"
confidence = "clamp_0_5_0_7"
needs_review = true

[scoring_criteria]
solo_or_small = "Identify solo founders or micro-teams (1-5 people)."
agency_or_studio = "Identify agencies / services studios that are scaling — corresponds to the small_agency_scaling segment."
no_ai = "Identify established companies with no AI-construction signal."
wrong_field = "Identify leads that are clearly not our target (too_big, wrong_field)."
