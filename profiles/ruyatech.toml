# RuyaTech lead-generation profile.
#
# STRUCTURE (all keys are snake_case):
#   [identity]         who sends the mail: company, sender, one-liner, proof points.
#   [offers.<key>]     one table per offer. <key> is the offer id used in verdicts
#                      (recommended_offer) and in [sequences.offers.<key>].
#   [segments.<key>]   one table per segment. <key> is the segment id used in
#                      verdicts. `offer` points at an [offers] key (or "none").
#                      `is_target` drives TARGET vs review/out-of-target routing.
#   [icp]              who we look for: headcount, countries, founded years,
#                      titles, and the Stage-0 reject/keep marker lists.
#                      Marker lists are plain strings joined into one regex at
#                      load time (see profile.py) — no regex syntax needed to
#                      edit them, except dev_shop_pattern which stays a pattern.
#   [voice]            real lines that earned replies; generators imitate these.
#   [criteria.<key>]   review-queue picker entries: UI label/text plus the
#                      scorer prompt description for the same key.
#   [scoring]          scorer prompt atoms (short offer clauses) and verbatim
#                      prose blocks that name segments in natural language.
#   [sequences]        Apollo sequence wiring for this offer set.
#   [[derivation.rules]] founder_profile x build_evidence -> segment/offer rules
#                      applied when the model returns segment "unclear".
#   [scoring_criteria] labels for the review-queue criteria picker.
#
# RULE: to change what we sell or to whom, edit this file only. No .py file
# holds business text for this profile.

[identity]
company = "RuyaTech"
# The mail signature is env-first (SENDER_NAME / SENDER_COMPANY), profile
# second. sender_name stays empty so the default signature is exactly the
# historical one ("RuyaTech"); a non-empty sender_name signs as
# "<sender_name> — <company>".
sender_name = ""
sender_title = "Founder"
# Three historical wordings of what RuyaTech is, preserved verbatim — one per
# prompt that uses them. A new profile may unify them into one_liner.
one_liner = "a technical agency that builds, rescues, and scales SaaS products for founders"
personal_line_blurb = "a technical agency that audits and rescues software products"
sequence_blurb = "a technical agency that audits and rescues software products that were built fast"
# Line breaks inside items are preserved verbatim into the email prompt
# (historical wrapping); a new profile can write plain single-line items.
proof_points = [
  "fixed price announced before\ncoding (no hourly billing)",
  "10+ delivered projects",
  "100% of the code belongs to the client\nfrom day one",
  "reply within 4 business hours",
]

[offers.ai_audit]
name = "Product Rescue & Scale-Up"
label = "AI Audit"
# Terse clause rendered into the scorer OFFERS sentence ("<key> is for ...").
short_who = "an AI-built product owned by a non-technical founder"
who = "non-technical founder whose product was built with AI (vibe-coding — Cursor, Replit, ChatGPT, Lovable, Bolt) and starts breaking under real users"
detail = "full code audit, stabilization, refactoring, and getting it back on track — typically in 4 to 8 weeks"
case_study = "we took over an AI-generated SaaS that was collapsing, relaunched it in 2 weeks, 600 paying members 6 months later (Bake Genie case study)"
# Rendered email bullet, preserved verbatim. who/detail/case_study above are
# the canonical definition; email_blurb is its mail rendering.
email_blurb = """- ai_audit → "Product Rescue & Scale-Up" service: for non-technical founders whose product was
  built with AI (vibe-coding — Cursor, Replit, ChatGPT, Lovable, Bolt) and starts breaking under
  real users. Full code audit, stabilization, refactoring, and getting it back on track —
  typically in 4 to 8 weeks. Concrete example to reuse if relevant: we took over an AI-generated
  SaaS that was collapsing, relaunched it in 2 weeks, 600 paying members 6 months later
  (Bake Genie case study)."""

[offers.general_audit]
name = "Product Rescue & Scale-Up"
label = "Technical Audit"
short_who = "a technical team needing architecture or security review"
who = "a technical team"
detail = "security and architecture audit, concrete recommendations, fix prioritization"
case_study = ""
email_blurb = """- general_audit → same "Product Rescue & Scale-Up" service, for a technical team:
  security and architecture audit, concrete recommendations, fix prioritization."""

[offers.pipeline]
name = "AI Agents & Automation"
label = "Pipeline Support"
short_who = "a scaling agency"
who = "a scaling agency"
detail = "custom AI agents and automations plugged into existing systems (lead triage, document processing, workflows), not \"AI gadgets\""
case_study = "lead triage pipeline delivered to an overwhelmed B2B firm — 5h/week of business dev instead of several hours a day, 30K$+ in new contracts in 30 days"
email_blurb = """- pipeline → "AI Agents & Automation" service: custom AI agents and automations plugged into
  existing systems (lead triage, document processing, workflows), not "AI gadgets".
  Concrete example to reuse if relevant: lead triage pipeline delivered to an overwhelmed B2B
  firm — 5h/week of business dev instead of several hours a day, 30K$+ in new contracts in
  30 days."""

[segments.ai_solo_founder]
description = "AI-built product owned by a non-technical founder"
offer = "ai_audit"
is_target = true
label = "Solo AI founder"

[segments.technical_founder]
description = "technical team needing architecture or security review"
offer = "general_audit"
is_target = true
label = "Technical founder"

[segments.small_agency_scaling]
description = "agency or studio that is scaling"
offer = "pipeline"
is_target = true
label = "Small scaling agency"
# Confident leads in this segment with a technical-hiring signal get the
# expensive web-evidence escalation (the high-value case that pass 1 alone
# never verified). Only this segment sets the flag.
escalate_on_hiring = true

[segments.too_big]
description = "company too large for the offer"
offer = "none"
is_target = false
label = "Too big"

[segments.wrong_field]
description = "lead clearly outside the target field"
offer = "none"
is_target = false
label = "Wrong field"

# Every profile must define an "unclear" segment: it is the reserved
# catch-all for insufficient evidence (like the "none" offer), and the
# derivation rules below can only fire from it.
[segments.unclear]
description = "insufficient evidence to segment"
offer = "none"
is_target = false
label = "Unclear"

# Review-queue picker entries, in display order. Segment keys reuse the
# segment above; the other keys are cross-cutting lenses. label/ui_desc are
# shown in the UI; prompt_desc goes into the scorer prompt for the same key.
[criteria.ai_solo_founder]
label = "TARGET: Non-tech vibe coder"
ui_desc = "Non-technical founder building with AI (Cursor, Bolt, Lovable, Replit, vibe coding)."
prompt_desc = "PRIMARY TARGET: identify non-technical founders who build with AI (vibe coding, Cursor, Bolt, Lovable, Replit) — corresponds to the ai_solo_founder segment."

[criteria.technical_founder]
label = "TARGET: Tech person using AI"
ui_desc = "Technical team using AI as a development tool."
prompt_desc = "SECONDARY TARGET: identify technical teams that use AI as a development tool — corresponds to the technical_founder segment."

[criteria.solo_or_small]
label = "Solo / Micro-team"
ui_desc = "Single founder or a team of 1-5 people."
prompt_desc = "Identify solo founders or micro-teams (1-5 people)."

[criteria.agency_or_studio]
label = "Agency / Studio"
ui_desc = "Service provider, web agency, creation studio."
prompt_desc = "Identify agencies / services studios that are scaling — corresponds to the small_agency_scaling segment."

[criteria.no_ai]
label = "Established without AI signals"
ui_desc = "Established company with no indication of building via AI."
prompt_desc = "Identify established companies with no AI-construction signal."

[criteria.wrong_field]
label = "Not our target"
ui_desc = "Unrelated sector, agency, or organization without AI dev usage."
prompt_desc = "Identify leads that are clearly not our target (too_big, wrong_field)."

[icp]
max_headcount = 20
min_headcount = 0
countries = ["United States", "United Kingdom", "Canada", "Australia", "Ireland", "New Zealand"]
founded_year_min = 2020
founded_year_max = 2026
person_titles = ["founder", "co-founder", "ceo", "owner"]
employee_ranges = ["1,10", "11,20"]

# NOTE: 'studio' is deliberately NOT in reject_company_markers — a product
# studio is a target (golden case george = small_agency_scaling). Only
# unambiguous service providers are rejected; ambiguous names fall through
# to 'unclear'/'keep'.
# Single-quoted TOML strings are literal: write regex escapes with a single
# backslash (\s, \b). Double-quoted strings would need them doubled.
reject_company_markers = [
  'agency',
  'agencies',
  'consult(?:ing|ancy|ants?)?',
  'labs?',
  'solutions',
  'software\s+house',
  'digital\s+agency',
  'dev\s?shop',
  'web\s+design',
  'it\s+services',
  'systems?\b',
  'systems\s+integrat',
  'outsourc',
  'technolog(?:y|ies)\s+partner',
  'interactive',
  'creative\s+agency',
  'staffing',
  'recruit(?:ing|ment)\s+agency',
  'we\s+build',
  'development\s+(?:company|partner|services)',
  'mvp\s+(?:development|studio|agency)',
  'app\s+development',
  'software\s+development',
]

# "X Software" / "X Technologies" with no product word is the classic
# dev-shop naming pattern. Product companies say what they DO.
dev_shop_pattern = "^[\\w&.'\\- ]{1,40}\\s+(software|technologies|technology|tech|systems|digital|it)\\s*(inc|llc|ltd|limited|pvt|pty|gmbh|co)?\\.?$"

# NOTE: plain "CTO", "engineer" or "technical co-founder" titles are
# deliberately NOT rejected here: a CTO / engineering founder of their OWN
# product company IS the technical_founder segment (golden cases marius,
# eric). Only the fractional / consulting / "we build for you" variants
# below are competitors — do not "fix" this by adding bare CTO/engineer.
reject_title_markers = [
  'agency\s+owner',
  'freelance',
  'freelancer',
  'consultant',
  'contractor',
  'fractional\s+(?:cto|cpo|coo|cmo|cfo)',
  'advisor',
  'mentor',
  'coach',
  'managing\s+director\s+at\s+.*\bagency\b',
  'we\s+build\s+(?:your|apps|mvps|software|products)',
]

non_decision_title_markers = [
  'intern',
  'student',
  'assistant',
  'recruiter',
  'talent',
  'hr\b',
  'human\s+resources',
  'sales\s+(?:rep|representative|development)',
  'sdr\b',
  'bdr\b',
  'account\s+executive',
  'support',
  'customer\s+success',
  'bookkeeper',
  'accountant',
  'receptionist',
]

founder_title_markers = [
  'founder',
  'co-?founder',
  'ceo',
  'owner',
  'managing\s+partner',
  'president',
  'chief\s+executive',
]

llm_prefilter_system = "You are a fast pre-filter for a B2B lead list. Given only a person's title, company name, headcount and founded year (no website), decide if they are plausibly a NON-TECHNICAL or technical FOUNDER of a small software product company (our target), or clearly NOT (agency, consultancy, dev shop, fractional CTO, enterprise employee, recruiter, unrelated sector). Respond ONLY as JSON: {\"decision\": \"keep\"|\"reject\", \"reason\": \"...\"}. When genuinely unsure, keep — a wrong reject loses a good lead."

[voice]
