[scoring]
# Scorer prompt material. The OFFERS / segment-choice / segment-offer-map
# sentences are DERIVED from [offers].short_who and [segments] (keys, order,
# offer links); the prose blocks below are verbatim because they name
# segments inside natural-language evidence rules no template can render.
unclear_note = "Unclear means insufficient evidence, not wrong_field or too_big."
# Two-axis evidence semantics (founder_profile x build_evidence) and how the
# segment follows from them. Mirrors [[derivation.rules]] for the model; the
# rules mirror it back for the code guard. Keep the two in sync.
axes_prose = """Two independent facts are judged separately. founder_profile: Apollo employment history is first-party evidence about the founder. A career with no engineering roles is sufficient to judge the founder non_technical; a career of engineering roles is sufficient to judge them technical, even when the website says nothing; semi_technical for product, data or no-code builders; unknown only when history is absent. build_evidence: ai_built when a STRONG or MEDIUM AI-build signal exists, hand_built when a technical team or engineering hires are evidenced, otherwise unknown. Derive the segment from them: ai_built with a non_technical, semi_technical or unknown founder is ai_solo_founder, and its confidence follows the strength of the build signal (STRONG signals justify 0.8 or more); non_technical + unknown build is still ai_solo_founder with confidence 0.5 to 0.7 (the founder question is settled, only the build method is open), never unclear; technical is technical_founder; an agency or studio that is scaling is small_agency_scaling. Use unclear only when BOTH founder_profile and build_evidence are unknown. Decide in order: enough evidence, founder_profile, build_evidence, scaling agency, too_big, wrong_field, otherwise unclear."""
# Standalone evidence-standard sentences, inserted after the signal hierarchy.
extra_rules = [
  "Cursor alone never proves ai_solo_founder.",
]
career_hint = "engineering/CTO roles point to technical_founder, non-technical roles with an AI-built product point to ai_solo_founder"

[sequences]
# Apollo sequence enrolment (the real multi-touch sender). enabled = false
# keeps every enrolment path a dry run. personalised_share is the A/B split:
# this share of approved leads gets the generated Personal Line, the rest run
# the same sequence with no line. 1.0 = personalise everyone, 0.0 = control.
# Ids read live from the account on 2026-09-10 (3-step sequences, active).
enabled = false
send_from_email = "oussama@ruyatech.io"
personal_line_field_id = "6a47de3d386294002003b1a6"
personalised_share = 0.5

# AIAUDIT B1 - Angle B (AI-built); sensitive variant is Angle A (AI-built,
# sensitive data, used when sensitive_data_categories is non-empty).
[sequences.offers.ai_audit]
id = "6a66cad9e37fae0018459329"
sensitive_id = "6a66cac7e37fae001436c196"

# AIAUDIT B1 - Angle C (general audit).
[sequences.offers.general_audit]
id = "6a66caecff375500136a7483"
sensitive_id = ""

# No sequence built for the automation offer yet: empty id means leads with
# this offer are reported, never sent.
[sequences.offers.pipeline]
id = ""
sensitive_id = ""

# Derivation rules: applied in order when the model returns segment
# "unclear". Each rule names the founder_profile / build_evidence it fires
# on ("any" matches everything). confidence is "keep" (model number stands)
# or "clamp_0_5_0_7" (founder settled, build open: honest band + review).
# Derivation rules, applied in order when the model returns segment
# "unclear" (the reserved catch-all). when_founder/when_build of "any" match
# everything. confidence "keep" lets the model number stand (below 0.7 it is
# reviewed anyway); "clamp_0_5_0_7" is the honest band for founder-settled,
# build-open verdicts and always needs review. needs_review forces review
# even for a confident "keep" outcome.
[[derivation.rules]]
when_founder = "technical"
when_build = "any"
set_segment = "technical_founder"
set_offer = "general_audit"
confidence = "clamp_0_5_0_7"
needs_review = true

[[derivation.rules]]
when_founder = "any"
when_build = "ai_built"
set_segment = "ai_solo_founder"
set_offer = "ai_audit"
confidence = "keep"
needs_review = false

[[derivation.rules]]
when_founder = "non_technical"
when_build = "any"
set_segment = "ai_solo_founder"
set_offer = "ai_audit"
confidence = "clamp_0_5_0_7"
needs_review = true
